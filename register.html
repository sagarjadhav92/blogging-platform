{% extends "base.html" %}{% block title %}Register · BlogSpace{% endblock %}
{% block content %}<div class="form-card"><p class="eyebrow">Join the community</p><h1>Create your account</h1><form method="post">
<label>Username</label><input name="username" required maxlength="40" placeholder="Choose a username">
<label>Email address</label><input type="email" name="email" required placeholder="you@example.com">
<label>Password</label><input type="password" name="password" required minlength="6" placeholder="At least 6 characters">
<button class="button full" type="submit">Create account</button></form><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div>{% endblock %}
