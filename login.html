{% extends "base.html" %}{% block title %}Login · BlogSpace{% endblock %}
{% block content %}<div class="form-card"><p class="eyebrow">Welcome back</p><h1>Login to your account</h1><form method="post">
<label>Email address</label><input type="email" name="email" required placeholder="you@example.com">
<label>Password</label><input type="password" name="password" required placeholder="Your password">
<button class="button full" type="submit">Login</button></form><p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div>{% endblock %}
